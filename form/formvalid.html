<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> User-Registration Form </title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <script src="formvalid.js"></script> 

    <form onsubmit="return validation()">
        <label>Username: </label>
        <input type="text" id="user" placeholder="enter your user name" autocomplete="off"><br><br>
        <span id="userr" style="color: red; font-weight: bold;"></span>

        <label>Password: </label>
        <input type="password" id="pass" placeholder="enter your password" autocomplete="off"><br><br>
        <span id="passs" style="color: red; font-weight: bold;"></span>

        <label>Confirm Password: </label>
        <input type="password" id="confpass" placeholder="confirm password" autocomplete="off"><br><br>
        <span id="confpasss" style="color: red; font-weight: bold;"></span>

        <label>Email Address: </label>
        <input type="text" id="email" placeholder="enter your email Address" autocomplete="off"><br><br>
        <span id="emaill" style="color: red; font-weight: bold;"></span>

        <label>Mobile number : </label>
        <input type="no" id="mobile" placeholder="enter your mobile number" autocomplete="off"><br><br>
        <span id="mobilee" style="color: red; font-weight: bold;"></span>





        <input type="submit" value="sign in ">
    </form>

       
    



    
    
</body>
</html>
